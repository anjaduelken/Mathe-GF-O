<header><h1>Lernapp Stochastik</h1><small>Mathematik &middot; Zweij&auml;hrige Berufsfachschule (FHR) &middot; Gesundheit und Soziales</small></header>

<script>
(function(){
"use strict";
/* ===== Einstellungen ===== */
var DEC=','; /* Dezimalzeichen: ',' (Schreibweise im Fach) oder '.' */
var KEY=[[95,15],[90,14],[85,13],[80,12],[75,11],[70,10],[65,9],[60,8],[55,7],[50,6],[45,5],[40,4],[33,3],[27,2],[20,1],[0,0]]; /* Prozent -> Notenpunkte */
var NOTE=['ungen\u00fcgend (6)','mangelhaft (5)','mangelhaft (5)','mangelhaft (5)','ausreichend (4)','ausreichend (4)','ausreichend (4)','befriedigend (3)','befriedigend (3)','befriedigend (3)','gut (2)','gut (2)','gut (2)','sehr gut (1)','sehr gut (1)','sehr gut (1)'];
var STORE_KEY='stochastik_lernapp_v1';

/* ===== Hilfsfunktionen ===== */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmt(x,d){var s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);if(s.indexOf('-')===0&&parseFloat(s)!==0){s='('+s+')';}else if(s.indexOf('-')===0){s=s.slice(1);}return s.replace('.',DEC);}
function f4(x){return fmt(x,4);}
function pc(x,d){return fmt(x*100,d===undefined?2:d)+'\u00a0%';}
function fr(a,b){return '<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function nCr(n,k){var r=1,i;if(k<0||k>n)return 0;for(i=1;i<=k;i++){r=r*(n-k+i)/i;}return Math.round(r);}
function binom(n,p,k){return nCr(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k);}
function cum(n,p,a,b){var s=0,i;for(i=a;i<=b;i++){s+=binom(n,p,i);}return s;}
function tolFor(x){return 0.0006;}
function pb(a){return '<sub>'+a+'</sub>';}
function sup(a){return '<sup>'+a+'</sup>';}

/* ===== Grafiken (SVG) ===== */
function svgFrac(cx,cy,a,b,anchor){
  var w=Math.max(String(a).length,String(b).length)*7+4;
  return '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="13">'+a+'</text>'+
    '<line x1="'+(cx-w/2)+'" y1="'+cy+'" x2="'+(cx+w/2)+'" y2="'+cy+'" stroke="#1F2933" stroke-width="1"/>'+
    '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="13">'+b+'</text>';
}
/* Baum: node = {l:'Name', c:[{e:'0,25' oder {a:3,b:8}, n:node}]} */
function leaves(n){if(!n.c||!n.c.length)return 1;var s=0,i;for(i=0;i<n.c.length;i++)s+=leaves(n.c[i].n);return s;}
function depth(n){if(!n.c||!n.c.length)return 0;var m=0,i;for(i=0;i<n.c.length;i++)m=Math.max(m,depth(n.c[i].n));return m+1;}
function drawTree(root,title){
  var D=depth(root),L=leaves(root),rowH=D>=3?42:56,colW=D>=3?150:190,W=40+D*colW+70,H=L*rowH+16,out='',idx=0;
  function lay(n,d){n.x=30+d*colW;if(!n.c||!n.c.length){n.y=8+idx*rowH+rowH/2;idx++;}else{var s=0,i;for(i=0;i<n.c.length;i++){lay(n.c[i].n,d+1);s+=n.c[i].n.y;}n.y=s/n.c.length;}}
  lay(root,0);
  function emit(n){var i,c,mx,my,lab;
    if(n.c){for(i=0;i<n.c.length;i++){c=n.c[i].n;
      out+='<line x1="'+n.x+'" y1="'+n.y+'" x2="'+c.x+'" y2="'+c.y+'" stroke="#34495E" stroke-width="1.6"/>';
      mx=(n.x+c.x)/2;my=(n.y+c.y)/2;
      lab=n.c[i].e;
      if(typeof lab==='object'){out+='<rect x="'+(mx-18)+'" y="'+(my-24)+'" width="36" height="34" fill="#fff"/>'+svgFrac(mx,my-6,lab.a,lab.b);}
      else{out+='<text x="'+mx+'" y="'+(my-6)+'" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="4" paint-order="stroke">'+lab+'</text>';}
      emit(c);}}
    out+='<circle cx="'+n.x+'" cy="'+n.y+'" r="4" fill="#34495E"/><text x="'+(n.x+8)+'" y="'+(n.y-7)+'" font-size="14" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke">'+n.l+'</text>';
  }
  emit(root);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(title||'Baumdiagramm')+'" font-family="Arial,Helvetica,sans-serif" fill="#1F2933">'+out+'</svg>';
}
function drawHist(n,p,sel,title,showMu){
  var W=540,Hh=230,L=52,B=34,pw=W-L-10,ph=Hh-B-18,bw=pw/(n+1),mx=0,vals=[],i,s='',h,x,t;
  for(i=0;i<=n;i++){vals.push(binom(n,p,i));if(vals[i]>mx)mx=vals[i];}
  var top=Math.ceil(mx*20)/20;if(top<mx)top+=0.05;if(top<0.1)top=0.1;
  s+='<line x1="'+L+'" y1="'+(18+ph)+'" x2="'+(W-6)+'" y2="'+(18+ph)+'" stroke="#1F2933"/><line x1="'+L+'" y1="14" x2="'+L+'" y2="'+(18+ph)+'" stroke="#1F2933"/>';
  for(t=0;t<=2;t++){var yv=top*t/2,yy=18+ph-yv/top*ph;s+='<line x1="'+(L-4)+'" y1="'+yy+'" x2="'+L+'" y2="'+yy+'" stroke="#1F2933"/><text x="'+(L-7)+'" y="'+(yy+4)+'" text-anchor="end" font-size="12">'+fmt(yv,2)+'</text>';}
  for(i=0;i<=n;i++){
    h=vals[i]/top*ph;x=L+i*bw;
    var on=sel(i);
    s+='<rect x="'+(x+1.5)+'" y="'+(18+ph-h)+'" width="'+Math.max(bw-3,1)+'" height="'+h+'" fill="'+(on?'#D55E00':'#0072B2')+'" stroke="'+(on?'#000':'none')+'" stroke-width="2"/>';
    if(n<=20||i%5===0)s+='<text x="'+(x+bw/2)+'" y="'+(18+ph+15)+'" text-anchor="middle" font-size="12">'+i+'</text>';
  }
  s+='<text x="'+(L+pw/2)+'" y="'+(Hh-3)+'" text-anchor="middle" font-size="12">k (Anzahl der Treffer)</text>';
  s+='<text x="12" y="'+(18+ph/2)+'" text-anchor="middle" font-size="12" transform="rotate(-90 12 '+(18+ph/2)+')">P(X = k)</text>';
  if(showMu){var mxp=L+(n*p+0.5)*bw;s+='<line x1="'+mxp+'" y1="14" x2="'+mxp+'" y2="'+(18+ph)+'" stroke="#000" stroke-dasharray="5 4"/><text x="'+(mxp+4)+'" y="26" font-size="12">&mu; = '+fmt(n*p,2)+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+(title||'Histogramm')+'" font-family="Arial,Helvetica,sans-serif" fill="#1F2933">'+s+'</svg>';
}
function figHist(n,p,sel,cap){return '<div class="fig">'+drawHist(n,p,sel,'Histogramm der Binomialverteilung mit n = '+n+' und p = '+fmt(p,2))+'<div class="cap">Histogramm mit n = '+n+' und p = '+fmt(p,2)+'. '+cap+'</div></div>';}
function tab4(rowA,rowB,colA,colB,cells,cap){ /* cells: [[a,b,sumRow1],[c,d,sumRow2],[s1,s2,total]] */
  var r,c,h='<table class="t" aria-label="Vierfeldertafel"><tr><th></th><th>'+colA+'</th><th>'+colB+'</th><th>Summe</th></tr>';
  var names=[rowA,rowB,'Summe'];
  for(r=0;r<3;r++){h+='<tr><th>'+names[r]+'</th>';for(c=0;c<3;c++){h+='<td>'+cells[r][c]+'</td>';}h+='</tr>';}
  return '<div class="fig">'+h+'</table><div class="cap">'+cap+'</div></div>';
}

/* ===== Aufgaben-Bausteine ===== */
function mcBuild(correct,wrongs){ /* correct: text; wrongs: [{t,err}] */
  var o=[{t:correct,ok:true,err:''}],i,seen={};seen[correct]=true;
  for(i=0;i<wrongs.length&&o.length<4;i++){if(!seen[wrongs[i].t]){seen[wrongs[i].t]=true;o.push({t:wrongs[i].t,ok:false,err:wrongs[i].err});}}
  return shuffle(o);
}
function pnum(label,op,afb,answer,w,sol,kind){return {label:label,op:op,afb:afb,kind:kind||'p',answer:answer,tol:(kind==='int'?0:(kind==='num'?0.011:tolFor(answer))),w:w,sol:sol};}
function pmc(label,op,afb,options,w,sol){return {label:label,op:op,afb:afb,kind:'mc',options:options,w:w,sol:sol};}
function S(steps,sentence){return {steps:steps,sentence:sentence};}
function verdict(b){return b?'wahr':'falsch';}

/* Baumaufbau: Stichprobe aus n Personen, k mit Merkmal M ("m") */
function sampleTree(n,k,stages,repl,lm,ln){
  function build(d,nn,kk){
    var nd={l:''};
    if(d===stages)return nd;
    var pm=repl?{a:k,b:n}:{a:kk,b:nn},pn=repl?{a:n-k,b:n}:{a:nn-kk,b:nn};
    nd.c=[];
    if(kk>0||repl)nd.c.push({e:pm,n:build(d+1,repl?nn:nn-1,repl?kk:kk-1)});
    if(nn-kk>0||repl)nd.c.push({e:pn,n:build(d+1,repl?nn:nn-1,kk)});
    var i;for(i=0;i<nd.c.length;i++){nd.c[i].n.l=(i===0&&(kk>0||repl))?lm:ln;}
    return nd;
  }
  var root=build(0,n,k);root.l='Start';return root;
}

/* ===== Aufgabentypen ===== */
var TYPES=[
 {id:'A',name:'Zufall und Laplace',comp:['M1']},
 {id:'B',name:'Baumdiagramm und Pfadregeln',comp:['M2','M3']},
 {id:'C',name:'Vierfeldertafel und bedingte Wahrscheinlichkeit',comp:['M4','M5']},
 {id:'D',name:'Testergebnisse und Satz von Bayes',comp:['M6']},
 {id:'E',name:'Binomialverteilung',comp:['M7']},
 {id:'F',name:'Erwartungswert, Histogramm und n gesucht',comp:['M8','M7']}
];
var KANN=[
 ['M1','Ich kann Wahrscheinlichkeiten bei Laplace-Experimenten und mit relativen H\u00e4ufigkeiten bestimmen und das Gegenereignis nutzen.'],
 ['M2','Ich kann zwei- und dreistufige Zufallsexperimente mit einem Baumdiagramm darstellen und die Pfadregeln anwenden (mit und ohne Zur\u00fccklegen).'],
 ['M3','Ich kann Wahrscheinlichkeiten f\u00fcr \u201egenau ein\u201c und \u201emindestens ein\u201c Treffer in mehrstufigen Zufallsexperimenten berechnen und dazu das Gegenereignis einsetzen.'],
 ['M4','Ich kann eine Vierfeldertafel ausf\u00fcllen und bedingte Wahrscheinlichkeiten bestimmen und deuten.'],
 ['M5','Ich kann stochastische Unabh\u00e4ngigkeit pr\u00fcfen und Aussagen \u00fcber Wahrscheinlichkeiten beurteilen.'],
 ['M6','Ich kann mit dem Satz von Bayes Testergebnisse deuten und die Aussagekraft eines positiven Tests beurteilen.'],
 ['M7','Ich kann Bernoulli-Ketten erkennen und die Binomialverteilung f\u00fcr \u201egenau\u201c, \u201eh\u00f6chstens\u201c und \u201emindestens\u201c berechnen.'],
 ['M8','Ich kann den Erwartungswert bestimmen, ein Histogramm deuten und die Anzahl der Versuche n berechnen.']
];
var OPS={1:'Gib an, Berechne, Wende an',2:'Bestimme, Ermittle',3:'Beurteile, Entwickle, \u00dcberpr\u00fcfe'};
var MK={ /* Typ -> Kompetenz je Stufe */
 A:['M1','M1','M1'],B:['M2','M3','M2'],C:['M4','M4','M5'],D:['M6','M6','M6'],E:['M7','M7','M7'],F:['M8','M8','M8']
};

var GENS={};

/* ---------- A: Zufall und Laplace ---------- */
GENS.A=function(l){
  var r,b,n,t,k,m,T,x;
  if(l===1){
    r=rnd(3,9);b=rnd(3,9);n=r+b;x=r/n;
    return {text:'Bei einer Tombola im Seniorenheim liegen <b>'+r+' Gewinnlose</b> und <b>'+b+' Nieten</b> im Lostopf. Eine Bewohnerin zieht ein Los.',
      fig:'<div class="fig"><svg viewBox="0 0 300 70" role="img" aria-label="Lostopf mit '+r+' Gewinnlosen und '+b+' Nieten"><rect x="10" y="10" width="'+(280*r/n)+'" height="30" fill="#0072B2"/><rect x="'+(10+280*r/n)+'" y="10" width="'+(280*b/n)+'" height="30" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="'+(10+140*r/n)+'" y="30" text-anchor="middle" font-size="14" fill="#fff">Gewinn: '+r+'</text><text x="'+(10+280*r/n+140*b/n)+'" y="30" text-anchor="middle" font-size="14" fill="#1F2933">Niete: '+b+'</text><text x="150" y="62" text-anchor="middle" font-size="13" fill="#1F2933">Lostopf mit insgesamt '+n+' Losen</text></svg></div>',
      parts:[pnum('Berechne die Wahrscheinlichkeit, dass die Bewohnerin ein Gewinnlos zieht.','Berechne',1,x,2,
        S(['Anzahl der g\u00fcnstigen Ergebnisse: '+r+' (Gewinnlose).','Anzahl aller Ergebnisse: '+r+' + '+b+' = '+n+'.','P(Gewinn) = '+fr(r,n)+' = '+f4(x)],'Die Wahrscheinlichkeit f\u00fcr ein Gewinnlos betr\u00e4gt '+f4(x)+' ('+pc(x)+').'))]};
  }
  if(l===2){
    n=pick([80,100,120,150,200]);k=Math.round(n*pick([0.15,0.2,0.25,0.3]));x=k/n;
    return {text:'Bei einer Reihenuntersuchung in einer Kita werden <b>'+n+' Kinder</b> untersucht. Bei <b>'+k+' Kindern</b> findet die Zahn\u00e4rztin Karies. Die relative H\u00e4ufigkeit wird als Sch\u00e4tzwert f\u00fcr die Wahrscheinlichkeit verwendet.',
      fig:'<div class="fig"><svg viewBox="0 0 300 70" role="img" aria-label="Balken: '+k+' von '+n+' Kindern mit Karies"><rect x="10" y="10" width="'+(280*x)+'" height="30" fill="#D55E00"/><rect x="'+(10+280*x)+'" y="10" width="'+(280*(1-x))+'" height="30" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="'+(10+140*x)+'" y="30" text-anchor="middle" font-size="13" fill="#fff">Karies</text><text x="'+(10+280*x+140*(1-x))+'" y="30" text-anchor="middle" font-size="13" fill="#1F2933">kein Karies</text><text x="150" y="62" text-anchor="middle" font-size="13" fill="#1F2933">'+n+' untersuchte Kinder</text></svg></div>',
      parts:[pnum('Bestimme die relative H\u00e4ufigkeit f\u00fcr Karies.','Bestimme',2,x,2,S(['Relative H\u00e4ufigkeit = Anzahl der Treffer geteilt durch Anzahl der Versuche.','h = '+fr(k,n)+' = '+f4(x)],'Die relative H\u00e4ufigkeit f\u00fcr Karies betr\u00e4gt '+f4(x)+' ('+pc(x)+').')),
             pnum('Bestimme die Wahrscheinlichkeit, dass ein zuf\u00e4llig ausgew\u00e4hltes Kind kein Karies hat.','Bestimme',2,1-x,2,S(['Gegenereignis: P(kein Karies) = 1 \u2212 P(Karies).','P(kein Karies) = 1 \u2212 '+f4(x)+' = '+f4(1-x)],'Ein zuf\u00e4llig ausgew\u00e4hltes Kind hat mit '+pc(1-x)+' kein Karies.'))]};
  }
  m=pick([8,16,20,40]);T=pick([4,10]);x=100/m;
  var truth=x<T,rd=m,rs=x/10,rt=1/m;
  function v2(val){return val<T;}
  var correct='Die Aussage ist '+verdict(truth)+', denn 1 von '+m+' entspricht '+fmt(x,2)+'\u00a0%.';
  var wr=[{t:'Die Aussage ist '+verdict(v2(rd))+', denn 1 von '+m+' entspricht '+fmt(rd,2)+'\u00a0%.',err:'Du hast 1 von '+m+' als '+m+'\u00a0% gelesen. Richtig ist: 1 geteilt durch '+m+' mal 100.'},
          {t:'Die Aussage ist '+verdict(v2(rs))+', denn 1 von '+m+' entspricht '+fmt(rs,2)+'\u00a0%.',err:'Das Komma ist um eine Stelle falsch verschoben. 1 geteilt durch '+m+' ergibt '+f4(1/m)+', das sind '+fmt(x,2)+'\u00a0%.'},
          {t:'Die Aussage ist '+verdict(v2(rt))+', denn 1 von '+m+' entspricht '+fmt(rt,2)+'\u00a0%.',err:'Du hast den Wert '+f4(1/m)+' nicht in Prozent umgerechnet (mal 100).'}];
  var opts=mcBuild(correct,wr);
  return {text:'Im Beipackzettel eines Impfstoffs steht: \u201eNebenwirkungen treten bei <b>1 von '+m+'</b> Geimpften auf.\u201c',
    fig:'<div class="fig"><svg viewBox="0 0 320 60" role="img" aria-label="'+m+' K\u00e4stchen, eines markiert"><g>'+(function(){var s='',i,w=300/m;for(i=0;i<m;i++){s+='<rect x="'+(10+i*w)+'" y="10" width="'+(w-2)+'" height="26" fill="'+(i===0?'#D55E00':'#fff')+'" stroke="#34495E"/>';}return s;})()+'</g><text x="160" y="54" text-anchor="middle" font-size="12" fill="#1F2933">orange: 1 von '+m+' Geimpften mit Nebenwirkung</text></svg></div>',
    parts:[pnum('Bestimme die Wahrscheinlichkeit f\u00fcr Nebenwirkungen als Dezimalzahl.','Bestimme',2,1/m,1,S(['P = 1 von '+m+' = '+fr(1,m)+' = '+f4(1/m)],'Die Wahrscheinlichkeit f\u00fcr Nebenwirkungen betr\u00e4gt '+f4(1/m)+'.')),
           pmc('\u00dcberpr\u00fcfe die Aussage: \u201eDie Wahrscheinlichkeit f\u00fcr Nebenwirkungen liegt unter '+T+'\u00a0%.\u201c','\u00dcberpr\u00fcfe',3,opts,3,
             S(['Umrechnen in Prozent: '+f4(1/m)+' \u00b7 100\u00a0% = '+fmt(x,2)+'\u00a0%.','Vergleich mit der Grenze: '+fmt(x,2)+'\u00a0% '+(truth?'<':'\u2265')+' '+T+'\u00a0%.'],'Die Aussage ist '+verdict(truth)+': Die Wahrscheinlichkeit betr\u00e4gt '+fmt(x,2)+'\u00a0%.'))]};
};

/* ---------- B: Baumdiagramm ---------- */
GENS.B=function(l){
  var n,k,g,a,r,b,x,v;
  if(l===1){
    n=rnd(8,14);k=rnd(3,6);x=k/n*((k-1)/(n-1));
    return {text:'Ein Pflegeteam hat <b>'+n+' Mitarbeitende</b>. <b>'+k+'</b> von ihnen haben die Hygieneunterweisung noch nicht besucht (U). Die Leitung kontrolliert zuf\u00e4llig <b>zwei</b> Personen nacheinander, ohne Zur\u00fccklegen.',
      fig:'<div class="fig">'+drawTree(sampleTree(n,k,2,false,'U','O'),'Baumdiagramm: zwei Z\u00fcge ohne Zur\u00fccklegen')+'<div class="cap">U: ohne Unterweisung, O: mit Unterweisung. Die \u00c4ste zeigen die Wahrscheinlichkeiten.</div></div>',
      parts:[pnum('Berechne die Wahrscheinlichkeit, dass <b>beide</b> kontrollierten Personen ohne Unterweisung sind.','Berechne',1,x,2,
        S(['Erster Zug: P(U) = '+fr(k,n)+'.','Zweiter Zug ohne Zur\u00fccklegen: P(U) = '+fr(k-1,n-1)+'.','1. Pfadregel (multiplizieren): P = '+fr(k,n)+' \u00b7 '+fr(k-1,n-1)+' = '+fr(k*(k-1),n*(n-1))+' = '+f4(x)],'Mit einer Wahrscheinlichkeit von '+pc(x)+' haben beide Personen keine Unterweisung.'))]};
  }
  if(l===2&&Math.random()<0.5){
    n=rnd(8,12);k=rnd(2,5);g=n-k;a=g/n*((g-1)/(n-1))*((g-2)/(n-2));
    return {text:'In einem Team von <b>'+n+' Personen</b> haben <b>'+k+'</b> keinen Impfnachweis (K). Drei Personen werden nacheinander zuf\u00e4llig und ohne Zur\u00fccklegen \u00fcberpr\u00fcft.',
      fig:'<div class="fig">'+drawTree(sampleTree(n,k,3,false,'K','N'),'Baumdiagramm: drei Z\u00fcge ohne Zur\u00fccklegen')+'<div class="cap">K: ohne Nachweis, N: mit Nachweis.</div></div>',
      parts:[pnum('Bestimme die Wahrscheinlichkeit, dass alle drei Personen einen Nachweis haben.','Bestimme',2,a,2,
          S(['Pfad N-N-N: '+fr(g,n)+' \u00b7 '+fr(g-1,n-1)+' \u00b7 '+fr(g-2,n-2),'= '+fr(g*(g-1)*(g-2),n*(n-1)*(n-2))+' = '+f4(a)],'Mit '+pc(a)+' haben alle drei Personen einen Nachweis.')),
        pnum('Bestimme die Wahrscheinlichkeit, dass <b>mindestens eine</b> Person keinen Nachweis hat.','Bestimme',2,1-a,2,
          S(['Gegenereignis von \u201emindestens eine ohne Nachweis\u201c ist \u201ealle drei mit Nachweis\u201c.','P = 1 \u2212 '+f4(a)+' = '+f4(1-a)],'Mit '+pc(1-a)+' ist mindestens eine Person ohne Nachweis dabei.'))]};
  }
  if(l===2){
    r=rnd(2,6);b=rnd(2,6);n=r+b;x=r/n*b/n;
    return {text:'In einer Urne liegen <b>'+r+' rote</b> (R) und <b>'+b+' blaue</b> (B) Kugeln. Es wird <b>zweimal mit Zur\u00fccklegen</b> gezogen.',
      fig:'<div class="fig">'+drawTree(sampleTree(n,r,2,true,'R','B'),'Baumdiagramm: zwei Z\u00fcge mit Zur\u00fccklegen')+'<div class="cap">R: rote Kugel, B: blaue Kugel.</div></div>',
      parts:[pnum('Bestimme die Wahrscheinlichkeit f\u00fcr den Pfad \u201eerst rot, dann blau\u201c.','Bestimme',2,x,2,S(['1. Pfadregel: P(R, B) = '+fr(r,n)+' \u00b7 '+fr(b,n)+' = '+fr(r*b,n*n)+' = '+f4(x)],'Die Wahrscheinlichkeit f\u00fcr \u201eerst rot, dann blau\u201c betr\u00e4gt '+f4(x)+'.')),
             pnum('Bestimme die Wahrscheinlichkeit f\u00fcr <b>genau eine</b> rote Kugel.','Bestimme',2,2*x,2,S(['Zwei Pfade geh\u00f6ren dazu: R-B und B-R.','Beide Pfade haben dieselbe Wahrscheinlichkeit: '+f4(x),'2. Pfadregel (addieren): P = 2 \u00b7 '+f4(x)+' = '+f4(2*x)],'Die Wahrscheinlichkeit f\u00fcr genau eine rote Kugel betr\u00e4gt '+f4(2*x)+' ('+pc(2*x)+').'))]};
  }
  n=rnd(8,14);k=rnd(3,6);var w=k/n*k/n,o=k/n*((k-1)/(n-1));
  var corr='Ohne Zur\u00fccklegen ist die Wahrscheinlichkeit kleiner, denn nach dem ersten Zug sind weniger Personen ohne Unterweisung \u00fcbrig.';
  var opts=mcBuild(corr,[
    {t:'Ohne Zur\u00fccklegen ist die Wahrscheinlichkeit gr\u00f6\u00dfer, denn im zweiten Zug sind insgesamt weniger Personen zur Auswahl.',err:'Der Nenner wird kleiner, aber auch der Z\u00e4hler: Es ist ja eine Person ohne Unterweisung weniger \u00fcbrig.'},
    {t:'Beide Wahrscheinlichkeiten sind gleich, denn jede Person wird mit derselben Wahrscheinlichkeit gezogen.',err:'Ohne Zur\u00fccklegen h\u00e4ngt der zweite Zug vom ersten ab. Die Wahrscheinlichkeiten sind nicht gleich.'},
    {t:'Mit Zur\u00fccklegen ist die Wahrscheinlichkeit kleiner, denn dieselbe Person kann zweimal gezogen werden.',err:'Gerade weil dieselbe Person erneut gezogen werden kann, bleibt der Anteil ohne Unterweisung gleich hoch. Das ergibt die gr\u00f6\u00dfere Wahrscheinlichkeit.'}]);
  return {text:'Ein Team hat <b>'+n+' Mitarbeitende</b>, <b>'+k+'</b> haben die Hygieneunterweisung noch nicht besucht. Zwei Personen werden nacheinander zuf\u00e4llig kontrolliert. Es wird verglichen, ob mit oder ohne Zur\u00fccklegen gezogen wird.',
    fig:'<div class="fig">'+drawTree(sampleTree(n,k,2,false,'U','O'),'Baumdiagramm ohne Zur\u00fccklegen')+'<div class="cap">Baum f\u00fcr das Ziehen ohne Zur\u00fccklegen (U: ohne Unterweisung, O: mit Unterweisung).</div></div>',
    parts:[pnum('Bestimme die Wahrscheinlichkeit, dass beide Personen ohne Unterweisung sind, beim Ziehen <b>mit</b> Zur\u00fccklegen.','Bestimme',2,w,1,S(['P = '+fr(k,n)+' \u00b7 '+fr(k,n)+' = '+fr(k*k,n*n)+' = '+f4(w)],'Mit Zur\u00fccklegen betr\u00e4gt die Wahrscheinlichkeit '+f4(w)+'.')),
           pnum('Bestimme dieselbe Wahrscheinlichkeit beim Ziehen <b>ohne</b> Zur\u00fccklegen.','Bestimme',2,o,1,S(['P = '+fr(k,n)+' \u00b7 '+fr(k-1,n-1)+' = '+fr(k*(k-1),n*(n-1))+' = '+f4(o)],'Ohne Zur\u00fccklegen betr\u00e4gt die Wahrscheinlichkeit '+f4(o)+'.')),
           pmc('Beurteile, wie sich die beiden Wahrscheinlichkeiten unterscheiden.','Beurteile',3,opts,2,S(['Vergleich: '+f4(o)+' < '+f4(w)+'.','Nach einem Zug ohne Zur\u00fccklegen bleiben '+(k-1)+' von '+(n-1)+' Personen ohne Unterweisung \u00fcbrig, das ist ein kleinerer Anteil als '+k+' von '+n+'.'],'Ohne Zur\u00fccklegen ist die Wahrscheinlichkeit kleiner, weil sich der Anteil nach dem ersten Zug verkleinert.'))]};
};

/* ---------- C: Vierfeldertafel ---------- */
function dataC(){
  var n=pick([200,250,400,500]),a=n*pick([0.4,0.5,0.6]),pg=pick([0.1,0.15,0.2]),pn=pick([0.3,0.35,0.4]);
  var x=Math.round(a*pg),y=Math.round((n-a)*pn);
  return {n:n,a:a,x:x,y:y};
}
function tabC(d,known){
  var q='?';
  return tab4('geimpft','nicht geimpft','erkrankt','nicht erkrankt',[[d.x,known?d.a-d.x:q,d.a],[d.y,known?d.n-d.a-d.y:q,d.n-d.a],[known?d.x+d.y:q,known?d.n-d.x-d.y:q,d.n]],'Vierfeldertafel mit absoluten H\u00e4ufigkeiten. \u201e?\u201c: Wert nicht gegeben.');
}
GENS.C=function(l){
  var d=dataC(),n=d.n,a=d.a,x=d.x,y=d.y,v,ans,txt,sol;
  var head='In einer Studie werden <b>'+n+' Personen</b> beobachtet. <b>'+a+'</b> sind gegen Grippe geimpft (G). Von den Geimpften erkranken <b>'+x+'</b>, von den nicht Geimpften <b>'+y+'</b> (E: erkrankt).';
  if(l===1){
    v=rnd(0,1);
    if(v===0){ans=x/a;txt='Berechne die Wahrscheinlichkeit, dass eine <b>geimpfte</b> Person erkrankt.';sol=S(['Bedingung: geimpft. Alle Geimpften: '+a+'.','Davon erkrankt: '+x+'.','P'+pb('G')+'(E) = '+fr(x,a)+' = '+f4(ans)],'Eine geimpfte Person erkrankt mit '+pc(ans)+'.');}
    else {ans=y/(n-a);txt='Berechne die Wahrscheinlichkeit, dass eine <b>nicht geimpfte</b> Person erkrankt.';sol=S(['Bedingung: nicht geimpft. Alle nicht Geimpften: '+n+' \u2212 '+a+' = '+(n-a)+'.','Davon erkrankt: '+y+'.','P'+pb('nicht G')+'(E) = '+fr(y,n-a)+' = '+f4(ans)],'Eine nicht geimpfte Person erkrankt mit '+pc(ans)+'.');}
    return {text:head,fig:tabC(d,false),parts:[pnum(txt,'Berechne',1,ans,2,sol)]};
  }
  if(l===2){
    return {text:head,fig:tabC(d,false),parts:[
      pnum('Bestimme die Anzahl aller erkrankten Personen.','Bestimme',2,x+y,2,S(['Erkrankte Geimpfte: '+x+', erkrankte nicht Geimpfte: '+y+'.','Summe: '+x+' + '+y+' = '+(x+y)],'Insgesamt sind '+(x+y)+' Personen erkrankt.'),'int'),
      pnum('Bestimme die Wahrscheinlichkeit, dass eine <b>erkrankte</b> Person geimpft ist.','Bestimme',2,x/(x+y),2,S(['Bedingung: erkrankt. Alle Erkrankten: '+(x+y)+'.','Davon geimpft: '+x+'.','P'+pb('E')+'(G) = '+fr(x,x+y)+' = '+f4(x/(x+y))],'Unter den Erkrankten sind '+pc(x/(x+y))+' geimpft.'))]};
  }
  if(Math.random()<0.5){
    var pgv=x/a,pnv=y/(n-a),r=pnv/pgv,truth=r>2;
    var correct='Die Aussage ist '+verdict(truth)+', denn das Verh\u00e4ltnis der Wahrscheinlichkeiten betr\u00e4gt '+fmt(r,2)+' zu 1.';
    var rc=y/x,dif=(pnv-pgv)*100;
    var opts=mcBuild(correct,[
      {t:'Die Aussage ist '+verdict(rc>2)+', denn das Verh\u00e4ltnis der Anzahlen Erkrankter betr\u00e4gt '+fmt(rc,2)+' zu 1.',err:'Du hast die absoluten Anzahlen verglichen. Die Gruppen sind verschieden gro\u00df, deshalb m\u00fcssen die Anteile verglichen werden.'},
      {t:'Die Aussage ist wahr, denn die Differenz der Wahrscheinlichkeiten betr\u00e4gt '+fmt(dif,2)+' Prozentpunkte.',err:'Eine Differenz sagt nichts \u00fcber \u201edoppelt so hoch\u201c. Daf\u00fcr brauchst du das Verh\u00e4ltnis (Quotient).'},
      {t:'Die Aussage ist '+verdict(!truth)+', denn das Verh\u00e4ltnis der Wahrscheinlichkeiten betr\u00e4gt '+fmt(r,2)+' zu 1.',err:'Der Quotient ist richtig, aber du hast ihn falsch gedeutet. Er wird mit der Zahl 2 verglichen.'}]);
    return {text:head+' Eine Mitarbeiterin sagt: \u201eDas Erkrankungsrisiko ist bei nicht Geimpften mehr als doppelt so hoch wie bei Geimpften.\u201c',fig:tabC(d,false),parts:[
      pnum('Bestimme die Wahrscheinlichkeit P'+pb('G')+'(E) f\u00fcr Geimpfte.','Bestimme',2,pgv,1,S(['P'+pb('G')+'(E) = '+fr(x,a)+' = '+f4(pgv)],'Bei Geimpften liegt das Risiko bei '+pc(pgv)+'.')),
      pnum('Bestimme die Wahrscheinlichkeit P'+pb('nicht G')+'(E) f\u00fcr nicht Geimpfte.','Bestimme',2,pnv,1,S(['P'+pb('nicht G')+'(E) = '+fr(y,n-a)+' = '+f4(pnv)],'Bei nicht Geimpften liegt das Risiko bei '+pc(pnv)+'.')),
      pmc('Beurteile die Aussage der Mitarbeiterin.','Beurteile',3,opts,2,S(['Quotient: '+f4(pnv)+' : '+f4(pgv)+' = '+fmt(r,2)+'.','Vergleich mit 2: '+fmt(r,2)+(truth?' > 2.':' \u2264 2.')],'Die Aussage ist '+verdict(truth)+': Das Risiko ist bei nicht Geimpften das '+fmt(r,2)+'-Fache.'))]};
  }
  /* Unabhaengigkeit */
  var ind=Math.random()<0.5,N=pick([200,400]),A=N/2,e=pick([0.1,0.2,0.3]),X,Y;
  X=Math.round(A*e);Y=ind?Math.round((N-A)*e):Math.round((N-A)*(e+pick([0.1,-0.05])));
  var dd={n:N,a:A,x:X,y:Y},pE=(X+Y)/N,pGE=X/A,same=Math.abs(pE-pGE)<1e-9;
  var corr2='Die Merkmale sind '+(same?'unabh\u00e4ngig':'nicht unabh\u00e4ngig')+', denn P'+pb('G')+'(E) = '+f4(pGE)+' ist '+(same?'gleich':'ungleich')+' P(E) = '+f4(pE)+'.';
  var opts2=mcBuild(corr2,[
    {t:'Die Merkmale sind '+(same?'nicht unabh\u00e4ngig':'unabh\u00e4ngig')+', denn P'+pb('G')+'(E) = '+f4(pGE)+' ist '+(same?'gleich':'ungleich')+' P(E) = '+f4(pE)+'.',err:'Du hast das Kriterium falsch herum angewendet. Unabh\u00e4ngig bedeutet P'+pb('G')+'(E) = P(E).'},
    {t:'Die Merkmale sind unabh\u00e4ngig, denn in beiden Gruppen erkranken '+(X>0&&Y>0?'Personen':'Menschen')+' (X = '+X+', Y = '+Y+').',err:'Dass in beiden Gruppen Personen erkranken, sagt nichts \u00fcber Unabh\u00e4ngigkeit. Du musst Anteile vergleichen.'},
    {t:'Die Merkmale sind '+(X===Y?'unabh\u00e4ngig':'nicht unabh\u00e4ngig')+', denn '+X+' '+(X===Y?'ist gleich':'ist ungleich')+' '+Y+'.',err:'Die absoluten Anzahlen reichen nicht. Berechne P'+pb('G')+'(E) und P(E).'}]);
  return {text:'In einer Studie werden <b>'+N+' Personen</b> beobachtet. <b>'+A+'</b> sind geimpft (G). Von den Geimpften erkranken <b>'+X+'</b>, von den nicht Geimpften <b>'+Y+'</b> (E: erkrankt).',fig:tabC(dd,false),parts:[
    pnum('Bestimme die Wahrscheinlichkeit P(E), dass eine zuf\u00e4llig ausgew\u00e4hlte Person erkrankt.','Bestimme',2,pE,1,S(['Alle Erkrankten: '+X+' + '+Y+' = '+(X+Y)+'.','P(E) = '+fr(X+Y,N)+' = '+f4(pE)],'Insgesamt erkranken '+pc(pE)+' der Personen.')),
    pnum('Bestimme die Wahrscheinlichkeit P'+pb('G')+'(E) unter den Geimpften.','Bestimme',2,pGE,1,S(['P'+pb('G')+'(E) = '+fr(X,A)+' = '+f4(pGE)],'Unter den Geimpften erkranken '+pc(pGE)+'.')),
    pmc('\u00dcberpr\u00fcfe, ob Impfung und Erkrankung stochastisch unabh\u00e4ngig sind.','\u00dcberpr\u00fcfe',3,opts2,2,S(['Kriterium: unabh\u00e4ngig, wenn P'+pb('G')+'(E) = P(E).','Vergleich: '+f4(pGE)+(same?' = ':' \u2260 ')+f4(pE)+'.'],'Die Merkmale sind '+(same?'stochastisch unabh\u00e4ngig':'nicht stochastisch unabh\u00e4ngig')+'.'))]};
};

/* ---------- D: Tests und Bayes ---------- */
function dataD(l){
  var pr=pick([0.01,0.02,0.05,0.1]),se=pick([0.9,0.95,0.98]),sp=pick([0.95,0.97,0.99]);
  return {pr:pr,se:se,sp:sp};
}
function treeD(d){
  return {l:'Start',c:[
    {e:fmt(d.pr,2),n:{l:'I',c:[{e:fmt(d.se,2),n:{l:'+'}},{e:fmt(1-d.se,2),n:{l:'\u2212'}}]}},
    {e:fmt(1-d.pr,2),n:{l:'nI',c:[{e:fmt(1-d.sp,2),n:{l:'+'}},{e:fmt(d.sp,2),n:{l:'\u2212'}}]}}]};
}
GENS.D=function(l){
  var d=dataD(),pr=d.pr,se=d.se,sp=d.sp,pPos=pr*se+(1-pr)*(1-sp),bay=pr*se/pPos;
  var head='In einer Pflegeeinrichtung sind <b>'+pc(pr,0)+'</b> der Personen infiziert (I). Ein Schnelltest f\u00e4llt bei <b>'+pc(se,0)+'</b> der Infizierten positiv (+) aus und bei <b>'+pc(sp,0)+'</b> der Nichtinfizierten (nI) negativ (\u2212).';
  var fig='<div class="fig">'+drawTree(treeD(d),'Baumdiagramm zum Schnelltest')+'<div class="cap">I: infiziert, nI: nicht infiziert, +: positiv, \u2212: negativ.</div></div>';
  if(l===1){
    return {text:head+' Eine Person wird zuf\u00e4llig ausgew\u00e4hlt und getestet.',fig:fig,parts:[pnum('Berechne die Wahrscheinlichkeit, dass die Person infiziert ist <b>und</b> positiv getestet wird.','Berechne',1,pr*se,2,
      S(['Pfad I und +: P(I) = '+fmt(pr,2)+', P'+pb('I')+'(+) = '+fmt(se,2)+'.','1. Pfadregel: P(I \u2229 +) = '+fmt(pr,2)+' \u00b7 '+fmt(se,2)+' = '+f4(pr*se)],'Mit einer Wahrscheinlichkeit von '+pc(pr*se)+' ist die Person infiziert und positiv.'))]};
  }
  var N=10000,I=Math.round(N*pr),tp=Math.round(I*se),fp=Math.round((N-I)*(1-sp));
  if(l===2){

  }

  var opts=mcBuild(cor,[

    {t:'Die Aussage ist '+verdict(pPos>=T)+', denn '+pc(pPos,1)+' der Personen testen positiv.',err:'Du hast P(+) betrachtet. Gefragt ist aber der Anteil der Infizierten unter den positiv Getesteten.'}]);

function termSteps(n,p,a,b){var s=[],i;for(i=a;i<=b;i++){s.push('P(X = '+i+') = '+nCr(n,i)+' \u00b7 '+fmt(p,2)+sup(i)+' \u00b7 '+fmt(1-p,2)+sup(n-i)+' = '+f4(binom(n,p,i)));}return s;}
GENS.E=function(l){

      fig:figHist(n,p,function(i){return i<=a;},'Markiert: k \u2264 '+a+' (Teil a).'),

          S(['Gegenereignis von X \u2265 '+b+' ist X \u2264 '+(b-1)+'.'].concat(termSteps(n,p,0,b-1)).concat(['P(X \u2264 '+(b-1)+') = '+f4(cum(n,p,0,b-1)),'P(X \u2265 '+b+') = 1 \u2212 '+f4(cum(n,p,0,b-1))+' = '+f4(hb)]),'Mit einer Wahrscheinlichkeit von '+pc(hb)+' haben mindestens '+b+' Personen Nebenwirkungen.'))]};

  n=pick([8,10,12]);p=pick([0.6,0.7,0.8,0.9]);var c=Math.ceil(n*p);k=Math.max(2,c+pick([-2,-1,0,1]));if(k>n)k=n;
  var G=0.8,val=1-cum(n,p,0,k-1),truth=val>=G,pe=binom(n,p,k),mu=n*p,pl=cum(n,p,0,k);

      parts:[pnum('Bestimme die Wahrscheinlichkeit, dass unter <b>'+m+'</b> untersuchten Personen <b>mindestens eine</b> erkrankt ist.','Bestimme',2,q,2,

          S(['Ansatz: 1 \u2212 '+fmt(1-p,2)+sup('n')+' \u2265 '+fmt(z,2)+', also '+fmt(1-p,2)+sup('n')+' \u2264 '+fmt(1-z,2),'Logarithmus: n \u00b7 ln('+fmt(1-p,2)+') \u2264 ln('+fmt(1-z,2)+')','ln('+fmt(1-p,2)+') ist negativ, daher dreht sich das Zeichen: n \u2265 '+fr('ln('+fmt(1-z,2)+')','ln('+fmt(1-p,2)+')')+' = '+fmt(nr,2),'Aufrunden auf eine ganze Zahl: n = '+N],'Es m\u00fcssen mindestens '+N+' Personen untersucht werden.'),'int')]};
  }

        S(['Symmetrie: B(n; p; k) = B(n; 1 \u2212 p; n \u2212 k).','Neuer Erwartungswert: '+n+' \u00b7 '+fmt(q2,2)+' = '+fmt(n*q2,1)],'Das Histogramm wird an der Mitte gespiegelt und der Erwartungswert betr\u00e4gt '+fmt(n*q2,1)+'.'))]};
};

function makeTask(typeId,lvl){
  var g=GENS[typeId](lvl),i,sw=0;
  g.type=typeId;g.lvl=lvl;g.comp=MK[typeId][lvl-1];
  var afb=0;for(i=0;i<g.parts.length;i++){if(g.parts[i].afb>afb)afb=g.parts[i].afb;}
  g.afb=Math.max(afb,lvl===1?1:lvl);
  /* AFB der Aufgabe = Stufe */
  g.afb=lvl;
  var tot=(lvl===1)?2:4;
  for(i=0;i<g.parts.length;i++)sw+=g.parts[i].w;
  for(i=0;i<g.parts.length;i++)g.parts[i].pts=g.parts[i].w*tot/sw;
  g.total=tot;
  return g;
}

function parseNum(s){
  s=String(s).replace(/\s+/g,'').replace(/,/g,'.');
  var pct=/%$/.test(s),m,v;s=s.replace(/%$/,'');
  m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m){v=parseFloat(m[1])/parseFloat(m[2]);}else if(/^-?\d+(\.\d+)?$/.test(s)){v=parseFloat(s);}else return null;
  if(!isFinite(v))return null;
  return {v:v,pct:pct};
}
function evalPart(part,val){
  if(part.kind==='mc'){return val!==undefined&&val!==null&&part.options[val]&&part.options[val].ok===true;}
  var r=parseNum(val===undefined?'':val);if(!r)return false;var v=r.v;
  if(part.kind==='p'){if(r.pct||v>1)v=v/100;return Math.abs(v-part.answer)<=part.tol;}
  if(part.kind==='int'){return Math.abs(v-part.answer)<1e-9;}
  return Math.abs(v-part.answer)<=part.tol;
}
function ansText(part){
  if(part.kind==='mc'){var i;for(i=0;i<part.options.length;i++)if(part.options[i].ok)return part.options[i].t;}
  if(part.kind==='p')return f4(part.answer)+' ('+pc(part.answer)+')';
  if(part.kind==='int')return String(part.answer);
  return fmt(part.answer,2);
}

    }
    if(locked&&!res[i]&&vals[i]!==undefined&&vals[i]!==null){h+='<div class="fb bad">Nicht richtig. '+p.options[vals[i]].err+'</div>';}
    else if(locked&&!res[i]){h+='<div class="fb bad">Nicht beantwortet.</div>';}
  }else{
    var hint=p.kind==='p'?'z.\u00a0B. 0,25 oder 25\u00a0%':(p.kind==='int'?'ganze Zahl':'Zahl');

  }
  return h+'</div>';
}

function infoTree(){
  var box=document.getElementById('tr'),pA=0.3,pB1=0.8,pB2=0.1;
  box.innerHTML='<div class="row"><label>P(A) = <b id="v1"></b><br><input type="range" id="s1" min="0" max="100" value="30"></label><label>P'+pb('A')+'(B) = <b id="v2"></b><br><input type="range" id="s2" min="0" max="100" value="80"></label><label>P'+pb('nicht A')+'(B) = <b id="v3"></b><br><input type="range" id="s3" min="0" max="100" value="10"></label></div><div class="fig" id="tsvg"></div><div id="tcalc"></div>';
  function draw(){
    var t=pA*pB1+(1-pA)*pB2,bay=t>0?pA*pB1/t:0;
    document.getElementById('v1').textContent=fmt(pA,2);document.getElementById('v2').textContent=fmt(pB1,2);document.getElementById('v3').textContent=fmt(pB2,2);
    var root={l:'Start',c:[{e:fmt(pA,2),n:{l:'A',c:[{e:fmt(pB1,2),n:{l:'B = '+f4(pA*pB1)}},{e:fmt(1-pB1,2),n:{l:'nicht B = '+f4(pA*(1-pB1))}}]}},{e:fmt(1-pA,2),n:{l:'nicht A',c:[{e:fmt(pB2,2),n:{l:'B = '+f4((1-pA)*pB2)}},{e:fmt(1-pB2,2),n:{l:'nicht B = '+f4((1-pA)*(1-pB2))}}]}}]};
    document.getElementById('tsvg').innerHTML=drawTree(root,'Baumdiagramm mit Pfadwahrscheinlichkeiten')+'<div class="cap">Am Ende jedes Pfads steht seine Wahrscheinlichkeit (1. Pfadregel).</div>';
    document.getElementById('tcalc').innerHTML='<p>P(B) = '+fmt(pA,2)+' \u00b7 '+fmt(pB1,2)+' + '+fmt(1-pA,2)+' \u00b7 '+fmt(pB2,2)+' = <b>'+f4(t)+'</b> (2. Pfadregel)</p><p>P'+pb('B')+'(A) = '+fr(f4(pA*pB1),f4(t))+' = <b>'+f4(bay)+'</b> (Satz von Bayes)</p>';
  }
  document.getElementById('s1').oninput=function(){pA=this.value/100;draw();};
  document.getElementById('s2').oninput=function(){pB1=this.value/100;draw();};
  document.getElementById('s3').oninput=function(){pB2=this.value/100;draw();};

function infoBino(){
  var box=document.getElementById('bi'),n=10,p=0.8,k=8,mode='eq';
  box.innerHTML='<div class="row"><label>n = <b id="bn"></b><br><input type="range" id="sn" min="1" max="30" value="10"></label><label>p = <b id="bp"></b><br><input type="range" id="sp" min="5" max="95" value="80"></label><label>k = <b id="bk"></b><br><input type="range" id="sk" min="0" max="10" value="8"></label></div><div class="row" id="bm" role="group" aria-label="Art der Wahrscheinlichkeit"></div><div class="fig" id="bh"></div><p id="bo"></p>';
  var M=[['eq','genau k'],['le','h\u00f6chstens k'],['ge','mindestens k']],mb=document.getElementById('bm');
  M.forEach(function(m){var b=document.createElement('button');b.type='button';b.textContent=m[1];b.setAttribute('data-m',m[0]);b.onclick=function(){mode=m[0];draw();};mb.appendChild(b);});
  function inSel(i){return mode==='eq'?i===k:mode==='le'?i<=k:i>=k;}

    document.getElementById('bh').innerHTML=drawHist(n,p,inSel,'Histogramm',true)+'<div class="cap">Orange mit schwarzem Rand: Balken der gew\u00e4hlten Wahrscheinlichkeit. Gestrichelt: Erwartungswert.</div>';
    var lab=mode==='eq'?'P(X = '+k+')':mode==='le'?'P(X \u2264 '+k+')':'P(X \u2265 '+k+')';
    document.getElementById('bo').innerHTML=lab+' = <b>'+f4(sum)+'</b> ('+pc(sum)+'). Erwartungswert \u03bc = n \u00b7 p = '+n+' \u00b7 '+fmt(p,2)+' = <b>'+fmt(n*p,2)+'</b>.';
  }
  document.getElementById('sn').oninput=function(){n=parseInt(this.value,10);draw();};
  document.getElementById('sp').oninput=function(){p=this.value/100;draw();};
  document.getElementById('sk').oninput=function(){k=parseInt(this.value,10);draw();};
  draw();
}

    [].forEach.call(lp.querySelectorAll('input[type=text]'),function(inp){inp.onkeydown=function(e){if(e.key==='Enter')checkPractice();};});
  }else{document.getElementById('nx').onclick=function(){newPractice();vUeben();};}
}
function checkPractice(){
  var t=st.pTask,i,res=[],all=true;
  t.vals=readVals(t,t.vals);
  for(i=0;i<t.parts.length;i++){var ok=evalPart(t.parts[i],t.vals[i]);res.push(ok);if(!ok)all=false;}
  st.pRes=res;
  data.stats.done++;
  var msg;
  if(all){data.stats.right++;st.streak++;if(st.streak>data.stats.best)data.stats.best=st.streak;
    msg=LOBS[st.streak]?LOBS[st.streak]:(t.lvl===3?pick(LOBH):pick(LOB));}
  else{st.streak=0;msg=pick(AUF);}
  st.fbHTML='<div class="fb '+(all?'ok':'bad')+'" role="status"><span class="lab '+(all?'ok':'bad')+'">'+(all?'Richtig!':'Nicht richtig.')+'</span> '+msg+'</div>'+solHTML(t,false);
  save();checkBadges();
  vUeben();
}

/* ===== Selbsttest ===== */
function newTest(){
  var ids=TYPES.map(function(t){return t.id;}),a=shuffle(ids).slice(0,5),b=shuffle(ids).slice(0,5),tasks=[],i;
  for(i=0;i<5;i++)tasks.push(makeTask(a[i],1));
  for(i=0;i<5;i++)tasks.push(makeTask(b[i],pick([2,3])));
  tasks.forEach(function(t){t.vals=[];});
  return {tasks:tasks,idx:0,started:false,done:false,name:'',startAt:0};
}
function vTest(){
  if(!st.test){st.test=newTest();}
  var T=st.test;
  if(T.done){return vResult();}
  if(!T.started){
    app.innerHTML='<div class="page"><div class="card"><h2>Selbsttest</h2><p>10 Aufgaben, insgesamt <b>30 Punkte</b>: Teil 1 mit 5 Aufgaben zu je 2 Punkten, Teil 2 mit 5 Aufgaben zu je 4 Punkten (mit Teilpunkten). Die Zahlen sind bei jedem Versuch neu. Taschenrechner ist erlaubt.</p><ul><li>W\u00e4hrend des Tests bekommst du keine R\u00fcckmeldung.</li><li>Info und \u00dcbungen sind gesperrt.</li><li>Die L\u00f6sungswege siehst du nach dem Abgeben.</li></ul><div class="row"><button type="button" class="pri" id="go">Test starten</button></div></div></div>';
    document.getElementById('go').onclick=function(){T.started=true;T.startAt=Date.now();render();};
    return;
  }
  var t=T.tasks[T.idx],h='<div class="fit"><div class="bar card" style="margin:0;padding:.4rem .7rem"><div class="row"><b>Aufgabe '+(T.idx+1)+' von 10</b><span class="mut">Teil '+(T.idx<5?'1 (2 Punkte)':'2 (4 Punkte)')+'</span><div class="dots" role="group" aria-label="Aufgaben\u00fcbersicht">',i;
  for(i=0;i<10;i++){var ans=answered(T.tasks[i]);h+='<button type="button" data-n="'+i+'" class="'+(i===T.idx?'on':'')+(ans?' done':'')+'" aria-label="Aufgabe '+(i+1)+(ans?' (bearbeitet)':'')+'">'+(i+1)+(ans?'\u2713':'')+'</button>';}
  h+='</div></div></div><div class="pane" id="lp"></div><div class="pane" id="rp"></div></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('.dots button'),function(b){b.onclick=function(){saveCur();T.idx=parseInt(b.getAttribute('data-n'),10);vTest();};});
  var lp=document.getElementById('lp'),rp=document.getElementById('rp'),x='<p>'+chips(t)+'</p><p>'+t.text+'</p>';
  for(i=0;i<t.parts.length;i++)x+=partHTML(t,i,'test',t.vals,null);
  x+='<div class="row" style="margin-top:.4rem"><button type="button" id="pv"'+(T.idx===0?' disabled':'')+'>Zur\u00fcck</button>'+(T.idx<9?'<button type="button" class="pri" id="nx">Weiter</button>':'')+'<button type="button" class="pri" id="sub">Abgeben</button><button type="button" id="ab">Test abbrechen</button></div>';
  lp.innerHTML=x;rp.innerHTML=t.fig;
  bindOpts(lp,t,t.vals,function(){});
  function saveCur(){t.vals=readVals(t,t.vals);}
  document.getElementById('pv').onclick=function(){saveCur();T.idx--;vTest();};
  var nx=document.getElementById('nx');if(nx)nx.onclick=function(){saveCur();T.idx++;vTest();};
  document.getElementById('sub').onclick=function(){saveCur();var open=T.tasks.filter(function(q){return !answered(q);}).length;
    if(open>0)modal('Bei '+open+' Aufgabe'+(open===1?'':'n')+' fehlt noch eine Antwort. Trotzdem abgeben?',[['Ja, abgeben',function(){finishTest();},true],['Weiterarbeiten']]);
    else finishTest();};
  document.getElementById('ab').onclick=function(){modal('M\u00f6chtest du den Test wirklich abbrechen? Deine Antworten gehen verloren.',[['Ja, abbrechen',function(){st.test=null;render();},true],['Weiterarbeiten']]);};
}
function answered(t){var i;for(i=0;i<t.parts.length;i++){var v=t.vals[i];if(v!==undefined&&v!==null&&String(v).trim()!=='')return true;}return false;}
function noteFor(pct){var r=Math.round(pct*100)/100,i;for(i=0;i<KEY.length;i++){if(r>=KEY[i][0])return KEY[i][1];}return 0;}
function finishTest(){
  var T=st.test,i,j,pts=0,perfect=true;
  T.tasks.forEach(function(t){t.got=0;t.res=[];for(j=0;j<t.parts.length;j++){var ok=evalPart(t.parts[j],t.vals[j]);t.res.push(ok);if(ok)t.got+=t.parts[j].pts;else perfect=false;}pts+=t.got;});
  T.pts=Math.round(pts*100)/100;T.np=noteFor(T.pts/30*100);T.done=true;T.secs=Math.round((Date.now()-T.startAt)/1000);
  var d=new Date(),ds=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();T.date=ds;
  data.tests.push({pts:T.pts,np:T.np,date:ds});if(data.tests.length>20)data.tests.shift();
  save();
  checkBadges({perfect:perfect,np:T.np});
  render();
}
function vResult(){
  var T=st.test,h='<div class="page"><div class="card"><h2>Auswertung Selbsttest</h2><div class="row noprint"><label for="nm">Name (optional):</label><input type="text" id="nm" value="'+esc(T.name)+'" autocomplete="off"></div><p id="nmp"></p><p><b>Datum:</b> '+T.date+' &middot; <b>Dauer:</b> '+Math.floor(T.secs/60)+' min '+(T.secs%60)+' s</p><p class="big"><b>Punkte: '+fmt(T.pts,0)+' von 30 ('+fmt(T.pts/30*100,1)+'\u00a0%)</b> &middot; <b>Notenpunkte: '+T.np+'</b> &middot; <b>Note: '+NOTE[T.np]+'</b></p>';
  h+='<table class="t"><tr><th>Aufgabe</th><th>Typ</th><th>Kompetenz</th><th>Punkte</th></tr>';
  T.tasks.forEach(function(t,i){h+='<tr><td>'+(i+1)+'</td><td style="text-align:left">'+t.type+': '+TYPES.filter(function(x){return x.id===t.type;})[0].name+'</td><td>'+t.comp+'</td><td>'+fmt(t.got,0)+' von '+t.total+'</td></tr>';});
  h+='<tr><th colspan="3">Summe</th><th>'+fmt(T.pts,0)+' von 30</th></tr></table>';
  h+='<p class="cap">Notenschl\u00fcssel (Prozent \u2192 Notenpunkte): '+KEY.map(function(k){return 'ab '+k[0]+'\u00a0% '+k[1]+' NP';}).join(', ')+'.</p>';
  h+='<div class="row noprint"><button type="button" class="pri" id="pr">Drucken</button><button type="button" id="nw">Neuer Test</button><button type="button" id="hm">Zur Startseite</button></div></div>';
  T.tasks.forEach(function(t,i){
    h+='<div class="card"><h3>Aufgabe '+(i+1)+' ('+fmt(t.got,0)+' von '+t.total+' Punkten)</h3><p>'+chips(t)+'</p><p>'+t.text+'</p><div class="fig">'+''+'</div>';
    t.parts.forEach(function(p,j){
      var given=t.vals[j];var gv=p.kind==='mc'?(given!==undefined&&given!==null&&p.options[given]?p.options[given].t:'keine Antwort'):(given!==undefined&&String(given).trim()!==''?esc(given):'keine Antwort');
      h+='<div class="part '+(t.res[j]?'ok':'bad')+'"><div><b>'+LET.charAt(j)+')</b> '+p.label+'</div><div>Deine Antwort: '+gv+'</div>'+(t.res[j]?'<div><span class="lab ok">Richtig.</span></div>':'<div><span class="lab bad">Nicht richtig.</span> <span class="corr">Richtige L\u00f6sung: '+ansText(p)+'</span></div>')+'</div>';
    });
    h+=solHTML(t,false)+'</div>';
  });
  h+='</div>';
  app.innerHTML=h;
  var nm=document.getElementById('nm'),nmp=document.getElementById('nmp');
  function showName(){nmp.innerHTML=T.name?'<b>Name:</b> '+esc(T.name):'';}
  nm.oninput=function(){T.name=nm.value;showName();};showName();
  document.getElementById('pr').onclick=function(){try{window.print();}catch(e){}};
  document.getElementById('nw').onclick=function(){st.test=null;render();};
  document.getElementById('hm').onclick=function(){st.test=null;go('start');};
}
window.addEventListener('beforeprint',function(){var d=document.querySelectorAll('details'),i;for(i=0;i<d.length;i++)d[i].open=true;});

window.__stoch={st:st,data:function(){return data;},makeTask:makeTask,TYPES:TYPES,evalPart:evalPart,noteFor:noteFor,KEY:KEY,fmt:fmt};
render();
})();

</script>
